# 课题：增加新的幻灯片
## 教学目标	
1.	掌握制作演示文稿基本技能：增加新的幻灯片、增加背景图片、使用项目符号；
2.	理解项目符号与编号的区别，以及两者在逻辑表达上的意义。
3.	掌握（复习巩固）在幻灯片中增加文字所使用的“复制”、“粘贴”资料的方法；
4.	通过学习“红色之旅”活动，让学生明白现在的好日子来之不易，不能忘记曾经为新中国的诞生而抛头颅、洒热血的革命先烈
## 重点：
* 掌握制作演示文稿基本技能：增加新的幻灯片、增加文字、增加背景图片
## 难点	
* 设置背景时，“应用”和“全部应用”的区别

## 教学过程
### 插入幻灯片
* 任务1：
  - “延安精神”幻灯片之后插入一张空白新幻灯片（教师进行插入演示）。
  - 思考一下：在这张幻灯片里，标题应置于何处？正文又该放在哪里呢？

* 任务2：
 - 新幻灯片中输入文字时，思考标题“遵义简介”的合理位置。
 - 思考：若电脑中已存相关文字资料，是否还需键盘输入？应如何操作？（复制 + 粘贴）
[设计意图]：锻炼学生的资料整理和输入技能，增强自主学习意识

* 任务3：
 - 运用“复制 + 粘贴”法，将遵义简介资料填入正文（教师巡视纠错、指导）。

* 任务4：“井冈山精神”幻灯片里，为各并列内容添加项目符号以条理化表达（教师演示操作）。
 - 注意：修改打开的演示文稿文件后应尽快保存，避免因计算机故障或断电致修改内容丢失。

### 添加背景图片
* 任务5：素材中有几张遵义的图片，老师要将其中一张设为“遵义简介”幻灯片背景，如何操作呢？（教师演示）同时思考：“应用”与“全部应用”有何区别？
[设计意图]：培养学生对背景设置的掌握，区分不同应用范围

### 课堂小结
* 通过今天的学习谈谈你的收获和感想
	
## 教学随笔：
在本次教学中，通过明确的任务设置和教师的引导示范，学生积极参与各项操作练习。大部分学生能够掌握新增幻灯片及相关技能，但在背景设置的理解上仍有部分困惑。后续应加强个别指导，同时多提供实践机会让学生熟练运用，以提高整体教学效果。
