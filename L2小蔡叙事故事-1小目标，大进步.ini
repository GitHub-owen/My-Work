# 小目标，大进步

在启音学校三年级的教室里，总能看到一个特别的身影——小M。这个重度听力障碍的男孩有着可爱的酒窝和腼腆的微笑，却像被困在透明玻璃罩里：体锻课上四肢动作难以协调，常规教学无法抵达他的认知世界，游离的眼神与机械的点头构成了他独特的"保护色"。

### 破冰：寻找沟通的突破口

一次体锻课，我带教一、三年级同学原地踏步时，我发现队列中的小M很难跟上口令，他的手脚完全不听使唤，不是左腿、左手同步，就是右手、右脚共频，老师越是纠正他的动作，他越是紧张——额头上布满了汗珠，眼中尽是焦急与迷茫。我知道他想做好，只是能力不够！
课后，我加强了和班主任沟通，才知道原来他不仅肢体协调性差，日常生活、学习中也存在许多问题。于是，我开始留意起他，发现他对绘画特别专注。这个发现犹如黑暗中的萤火——我想，也许绘画是他表达自己的一种方式。

### 架桥：个性化的教学尝试

于是，我尝试着制作了一套卡通示范卡片，用"右臂前伸配合左腿抬起"的简笔画，让他理解动作要领；然后亲自示范、演示每一个步骤，让他进行模仿，尽管一开始他的动作依旧笨拙、不协调，但我并没有急于求成，而是耐心地握住他的手臂和小腿，一个动作、一个动作细心地纠正。在我的耐心引导下，他渐渐开始明白动作的要领，手、脚也能慢慢合拍了。虽然还不够熟练，偶尔还会出错，但他的眼神中却渐渐流露出了一丝自信。

### 绽放：慢教育的奇迹

为了让小M跟上节奏，我为他量身定制了学习任务，目标是每月掌握一个动作要领。同时，我也开始教他一些简单的手语，鼓励他勇敢表达自己的情感和需求，比如“今天我很开心！”、“学会了踏步了！”、“我想告诉大家……”每当他完成一个动作，哪怕不标准，我和同学们也会送上赞美，让他感受到被认可、被鼓励。过程虽艰难，进步也很缓慢，但这更显得每一点进步都是无比珍贵的。

### 反思与感悟

三个月后的体锻课上出现了动人的场景：小M不仅能用正确动作完成听口令走，还会主动用手语和同学交流——要掌握节奏！更令人惊喜的是，现在的他，脸上总带着自信的笑，并能用手语表达："老师，明天我想学……"。

这段特殊的教育突围，让我深切地认识到，每个孩子都是独一无二的。面对有特殊需求的孩子，真正的进步标准不该是整齐划一，而是昨日之我的超越；小M的故事仍在继续，他教会我们：当教育真正蹲下身来，每个看似微小的目标，都可能成为改写生命轨迹的星辰。教育最动人的光芒，往往绽放在“等一朵花开”的耐心守候中。

