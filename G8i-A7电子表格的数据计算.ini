# 课题:电子表格的数据计算

## 教学目标	
1.学生掌握电子表格软件的基本操作技能：公式计算、函数计算。
2.学生能够比较获得公式计算和函数计算的相同点和不同点，培养学生比较事物的能力。
3.部分学生能够发现单元格“复制柄”功能在公式计算和函数计算中的应用，培养学生观察事物的能力。

## 重点
公式计算和函数计算的区别

##难点
1. 单元格复制柄的使用技巧
2. 公式计算和函数计算的应用场景

	
## 教学过程

### 使用公式计算

样表：家庭公用事业费支出表

1. 数据格式设置
- 完成"单价"列输入
- 设置数字格式(格式→单元格→数字)

2. 公式计算基础
- 计算单月水费总价(消耗量×单价)
- 引导学生发现手工计算多个费用耗时较长
>设计思路：通过让学生先手工计算单月水费，体验手工计算的繁琐性，从而引发学生对更高效计算方法的需求。

3. 使用公式计算
- 示例:水费计算 F3=E3*D3
- 学生练习计算其他费用
注意:
- 输入"="开始
- 正确引用单元格
- 回车确认
>设计思路：通过简单的水费计算示例,让学生掌握公式计算的基本步骤和规则。先由教师演示标准操作流程,再让学生独立练习其他费用计算,加深对公式计算方法的理解和运用。注意事项的设置帮助学生避免常见错误,培养规范操作习惯。

4. 使用复制柄
- 演示复制柄快速计算
- 对比手工计算效率
- 强调首个公式准确性

练习:完成test4-2-3.xls中"总价"计算


### 使用函数计算

1. 引入函数概念
- 复习公式法计算
- 以72条记录计算为例,展示公式法效率低下
- 引出函数是预设好的计算公式

2. 函数使用方法
- 选择目标单元格
- 选择函数名
- 选择数据源范围
- 演示SUM函数使用

3. 常用函数练习
- SUM求和函数
- AVERAGE求平均值
- MAX求最大值 
- MIN求最小值

4. 实践练习
- 完成test4-2-9练习
- 完成复习题
- 对比公式法和函数法

教学随笔：
公式计算：
本节课学生在学习Excel公式时表现出浓厚兴趣。但也发现部分学生存在以下问题:
1. 输入公式时经常忘记"="号
2. 单元格引用不准确,常用手动输入数字代替单元格地址
3. 对复制柄的使用不够熟练,有时会误删原有数据

针对这些问题,我采取了以下措施:
- 反复强调公式输入的"三步法":等号→单元格→运算符
- 设计小组互助学习,让掌握较好的同学帮助其他同学
- 增加复制柄的练习机会

函数应用：
在学习函数时,学生遇到了一些典型困难:
1. 混淆了SUM和AVERAGE函数的使用场景
2. 选择数据范围时容易包含多余的空白单元格
3. 对函数参数的含义理解不够深入

教学改进措施:
- 通过生活实例解释函数的实际应用
- 演示错误示范,引导学生发现问题
- 设计分层练习,照顾不同水平的学生

课堂观察：
有趣的是,一些学生开始尝试将Excel应用到其他学科,如用SUM函数计算物理实验数据。这种跨学科应用值得鼓励。同时也发现部分学生过分依赖Excel,忽视了基本计算能力的培养,这一点需要在今后教学中注意平衡。

总的来说,本节课达到了预期目标,但在时间分配和难度把控上还需要进一步优化。建议下次可以增加实践环节,减少理论讲解时间,让学生在"做中学"。