# 图形的组合与旋转

## 教学目标

1. 掌握制作演示文稿基本技能：艺术字的插入、图形的组合、图形的翻转修改、链接到邮件地址、演示文稿的发送。
2. 通过用多种方法润色演示文稿，培养选择适当的艺术形式表达信息的能力。

## 教学重难点

### 重点

艺术字的插入、图形的组合、图形的翻转修改

### 难点

1. 艺术字工具条的正确使用
2. 图形的翻转

## 教学过程

### 引入

展示有艺术字的幻灯片和没有艺术字的幻灯片，两者对比，问学生更喜欢哪一个？引出本课的学习主题：图形的组合与交流

### 艺术标题的插入

任务1：把自己负责的幻灯片中的标题文字改成艺术字样式
插入艺术字的方法
利用“艺术字工具栏”对艺术字进行颜色、样式等改变
>设计意图：通过任务1，让学生掌握艺术字的插入方法，并学会利用“艺术字工具栏”对艺术字进行颜色、样式等改变。

### 图形的组成

任务2：将艺术字和自选图形进行组合
插入艺术字（或文本框）
插入自选图形
叠放次序的改变
图形的组合
试一试：将自己负责的幻灯片的标题文字（可以是艺术字，也可以是一般的文本框）和任意一种自己喜欢的自选图形进行组合
>设计意图：通过任务2，引导学生掌握图形组合基本技能，包括艺术字与图形结合、叠放次序调整等。此练习既培养操作技能，又提升视觉设计能力和创意表达。学生通过实践理解图形组合在演示文稿中的重要性及其视觉效果。


### 图形的翻转

任务3：图形的翻转
通过"绘图"工具栏中的"旋转或翻转"功能实现图形变换
实践活动：在幻灯片设计中添加对称图形，增强视觉效果
>设计意图：通过图形翻转任务，让学生掌握"旋转或翻转"功能，理解图形空间变换。实践对称图形设计既强化技能，又提升审美意识，帮助学生理解对称美在幻灯片中的应用。

## 教学随笔

本课采用以学生为中心的教学模式，知识在自主探究和合作交流中生成，教师主要起引导作用。学生通过对比观察，学会分析图形构成，合理插入和设置自选图形，并通过调整位置发现问题。这一过程培养了学生的问题分析、解决能力和探索精神。

针对学生操作水平差异大的情况，课堂中采用"小老师"策略，让能力强的学生帮助其他同学，实现以点带面。这种方式既提高了教学效率，也促进了学生间的互助合作。

不足之处：课堂中可能缺乏对创意设计的指导，过于关注技术操作而忽视了艺术性；同时，依赖"小老师"可能导致部分学生过度依赖，不利于独立能力的培养。未来教学中应加强对设计美感的引导，并确保每位学生都有独立实践的机会。