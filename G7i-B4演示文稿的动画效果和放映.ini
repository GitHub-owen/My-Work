# 课题：演示文稿的动画效果和放映
### 教学目标
* 掌握对象动画效果设置
* 掌握幻灯片切换方式设置
* 掌握自定义放映方式设置
* 通过动画与切换效果设置实践，理解如何有效吸引观众注意力

### 重点
* 制作演示文稿的三项核心技能：对象动画效果、幻灯片切换方式、自定义放映设置

### 难点
* 自定义动画的进阶设置，针对性演示设置
### 教学准备

### 教学过程

#### 引入环节
* 使用对比教学法展示两种PPT，引导学生思考： → 哪个作品更吸引人？ → 为什么动画效果能提升展示效果？
`设计意图：通过对比激发学生的学习兴趣，让他们直观感受到动画效果的重要性。`
#### 实践任务
* 任务1："红色之旅"主幻灯片设置
  - 主标题 → "飞入"动画
  - 副标题 → "菱形进入"动画
  - 拓展练习："遵义"幻灯片
  - 副标题设置"从顶部飞入"动画
* 任务2：全局切换设置
  - 全文档应用"中速随机"切换方式
`设计意图：让学生亲身体验动画效果的设置过程，加深对动画效果的理解。通过具体案例，培养学生运用动画效果增强幻灯片表现力的能力。`

#### 进阶应用
* 自定义放映教学：
  - 演示创建自定义放映序列
  - 重点讲解局部放映技巧（如第2-5张连续播放）
  - 教师边演示边讲解或让小老师来演示，教师补充

#### 教学随笔
* 让学生亲身体验动画效果的设置过程，加深对动画效果的理解。

### 教学随笔：
“设置动画效果”是学生在学习PPT的页面编辑和幻灯片浏览和放映的基础上产生的。学生学会了幻灯片的一些操作技巧后，并能够对页面进行精心、合理的设计，使之产生一幅幅漂亮的画面。内容难度相对较高，但趣味性强，实用性大。
学生初次学习自定义动画时，让他们尝试各自操作，重点在于练习操作。在练习告一段落后，教师一 定要向学生们指明:动画的使用不能够喧宾夺主,一定要避免滥用动画，如：滥用逐字、逐句、逐线显示等表现手段；滥用动画或闪烁等技巧。
大部分学生能够做到的仅仅是利用动画增加幻灯片的生动性。

