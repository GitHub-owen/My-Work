# 对教材的分析和总体设计
* 本单元选择了三个与数据统计分析相关的活动作为主线来组织学生学习。这三个活动分别是“数码相机性能比较”、“家庭公用事业费支出统计”、“学校运动会统计”。在活动过程中，由浅入深地指导学生理解电子表格软件的功能、特点和作用，创设必要的情景，结合练习题，组织学生利用现有的资源，学习软件技能，同时又培养和锻炼学生的组织、分析、评价、回顾总结等方面的能力。另外，在整个单元中，有机的结合了爱国主义、团结协作、勤俭节约等方面的教育。
 - “数码相机性能比较”是第一个活动，这个活动作为电子表格学习的引子。在这个活动中所涉及到的电子表格操作技能最为简单，让学生能够很快地根据要求，建立美观的电子表格，由此建立学生学习的成功感，激发学生学习的热情。
 - “家庭公用事业费支出统计”是第二个活动，承接活动1和活动3。在这个活动中，涉及到的电子表格操作技能主要是计算统计，为数据分析做铺垫，并在活动中出现一些简单的数据分析和预测练习。
 - “学校运动会统计”是一个小组形式的活动，在前面两个个人活动的基础上，要学生体会发挥特长、团结协作、共同进步的感受。在这个活动中主要学习电子表格的统计分析技能，在这个过程中体会统计分析的作用，掌握统计分析的基本方法。
学习用Excel运算数据，体验数据软件强大的处理能力。数据处理软件是学生第一次接触，数据的结构、数据的操作对学生来说都是新的，因此激发学生学习兴趣是非常重要，导入更容易被学生接受和掌握的教学内容。 根据以往的经验，操作的步骤比较多，容易出错，在教学演示时要慢一些，要注意引导学生仔细观察。在编辑数据时，鼠标要准确地单击参加运算的位置；步骤多，窗口复杂，没有明确的提示，特别要引导学生观察操作演示，由易到难循序渐进地展示Excel的数据处理功能，体现数据处理方便快捷，减少学生操作上的失误，增强学习信心。