
#重点辅导学生*计划
## 特长生：
**李书瑶**：具有良好的信息素养，表现出思维敏捷和实践操作应变能力较强的特点。有独立完成上机任务的能力，但也有提升的空间。
**孙春城**：学习能力强，兴趣广，对信息概念有着深刻的理解和广泛的知识面，对感兴趣的东西很有研究，勇于尝试。
**王一鸣**： 勤奋好学，对信息知识基础有很好的理解。他在课堂上表现积极，然而，在打字方面存在一些困难，这影响了他在上机练习中的效率。
###  措施：
* 留给他么很大的空间去自主探索，调动他们积极的参与课堂活动，以满足他们对知识的需求。
* 充分发挥特长生的作用，带动后进，实现合作互助。
* 加强课外积累，拓展学生的视野，加强学生的灵活运用所学知识解决实际问题的能力，发展学生的综合应用能力。
## 困难生：
**龚予宸**： 转学多年来，他的手语学习一直没有明显进展，这使得他在课堂上与听障老师和同学的沟通都存在很大障碍，对电脑操作极度缺乏信心，在面对新的操作要求时，往往需要反复示范才能理解；即使是已经掌握的内容，也常常因为缺乏自信而无法顺利完成。
**金子璇**： 学习态度非常好，但是平时没有电脑积累导致学习的知识结构残缺不全，落后于其他同学。
###  措施：
* 教学中注意分层教学，放低要求，逐步提高。
* 要指导他们掌握正确的学习方法，养成良好的学习习惯。
* 多关注，多鼓励少批评，布置适当放松的练习作业帮助他们树立信心，让他们体验到学习的成功感，激发学习的兴趣。

# 教师教学计划
### 教学质量基本情况分析
八年级学生通过前面课程的学习已经基本掌握了Office系列组件的窗口结构，在此基础上学习Excel，学生对办公自动化软件有个感性的认识，同时也为下面学习更多的操作打下良好的基础。本学期所学内容能够解决现实生活中很多实际问题，对以后的学习生活有很重要的作用。八年级学生课堂表现活跃，对信息有强烈的学习兴趣，拥有探索精神并希望在课堂上得到一定的“自由”空间，在今后的教学中给他们设计拓展练习。同时，也由于个人知识结构、兴趣、家庭环境等因素，他们在信息技术认知能力、实际操作能力、知识水平上存在一定的差异，加上课时不足，因此在练习过程中尽可能降低难度以及有针对性的进行辅导。这样虽然掌握的东西少了些，但更加扎实，也不会打击学习自信。
### 教学质量目标及措施
### 目标：
1. 学生能够完成课程标准中所对应的软件技能学习三个层面（知道、领会、分析应用）的要求。
2. 学生了解电子表格软件的性能并掌握该软件的基本操作技能；
3. 学生能够根据数据比较的要求，以电子表格软件为工具，很快地建立较美观的电子表格；
4. 学生能使用电子表格软件进行基本的计算和统计，并能对统计的结果进行数据分析和简单的预测。
### 措施：
1. 增加上机操作时间，减少理论讲解，让学生通过实践熟练掌握技能。
2. 学习国家新课程标准，改善课堂教学方式和手段，促进学生主动学习。
  
