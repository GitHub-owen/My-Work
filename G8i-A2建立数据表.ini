# 课题：建立数据表

## 教学目标	
1.学生掌握电子表格软件的基本操作技能：打开、关闭和保存文件、输入数据文字。
2.学生通过自己利用光盘资源（视频教程）辅助学习，完成电子表格，培养学生的自学能力。
3.学生尝试通过“帮助”来解决学习困难，培养学生解决问题的能力。
## 重点	
* 学会在电子表格中输入数据的操作方法
* 运用WORD和PPT的迁移知识建立数码相机性能指标比较表
## 难点	
* 理解工作薄、工作表、单元格三者之间的关系
* 学会寻求电子表格的帮助

## 教学过程	

### 电子表格的组成
* 观察Excel电子表格窗口，认识Excel电子表格窗口的组成（和以前学过的其它Office软件做比较，如Word或Powerpoint），有共同之处的命令，起什么作用？ 重点介绍：工作薄、工作表、单元格
* 展示一本作文薄说明工作薄、工作表、单元格三者之间的关系。
[设计意图]：通过与其它Office软件的比较，帮助学生快速熟悉Excel的基本界面和组成部分，增强记忆和理解。

### 数据的输入
* 活动单元格：数据表内的单元格放置数据。学生将上节课在课本上已经完成的“一览表”，对应格式输入到电子表格软件的工作表，让学生体验如何将数据录入到电子表格软件中。

### 数据的简单编辑
* 数据的修改：学生在输入过程中遇到困难，参考“数据的输入和修改”视频教程。
* 数据的复制和粘贴：学生回忆以前制作网页时所用的“复制粘贴”方法，让学生用该方法来完成数据输入，提高完成表格的速度。

### 文件的保存
* 类似WORD、PPT的保存方法，注意每个10分钟保存，防止电脑出现故障导致丢失。

### 使用“帮助”
* 怎样才能更好地使用软件提供的“帮助”功能？
[设计意图]：多次强调并引导学生使用“帮助”功能，使其成为学生自主学习和解决问题的有力助手。

### 教学随笔：
本课的主要目的是帮助同学们迅速熟识电子表格软件的构成部分及其各部分的名称，诸如单元格的概念，行与列的标记，还有其他的常用工具栏与格式工具栏等。在建立和保存新工作簿方面，其方法与WORD一致，所以呢，老师没有展开详细讲解，而是通过唤起同学们对WORD操作的记忆来触类旁通，实现知识的融合运用。当然啦，针对一些术语和概念作形象具体的讲解，帮助学生加深对知识的理解和记忆。。
当同学们体验简单编辑数据时，着重向同学们强调“帮助”功能的作用与价值，加深同学们的印象，让同学们在遇到难题时，能够自然而然地想到运用“帮助”功能来查询并解决问题。
