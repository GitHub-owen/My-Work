#课题：开始行动	
## 教学目标	
* 学生能够了解数码相机的基本知识，明确选购数码相机的重要指标，建立相关性能的一览表。
* 学生通过利用多种方法，收集数码相机品牌、性能指标和相应的参数数据，培养收集、整理信息的能力，通过建立数码相机性能的一览表，培养分类比较事物的能力。
## 重点：
通过收集、整理、筛选信息掌握数码相机的比较方法
## 难点：
由于学生之间的理解能力、辨别能力存在差异，教师如何指导学生判别得到信息的正确性，如何筛选获得自己所需要的信息。
	
## 教学过程	

### 导入新课
* 向学生展示不同品牌和型号的数码相机实物或图片，询问学生对数码相机的了解程度及其选购时的考虑因素。

### 知识讲解
* 详细讲解数码相机的基本构造、工作原理及选购时的重要指标，如像素、镜头、传感器等。

### 信息收集与整理
* 布置任务，让学生利用网络收集不同品牌数码相机的性能指标和参数数据。
* 指导学生对收集到的信息进行整理，筛选出关键数据。
* 帮助学生建立数码相机性能的一览表。 
[设计意图]：培养学生的信息收集、整理能力，通过实际操作加深对数码相机性能指标的理解。

### 分类比较与讨论
* 指导学生根据一览表对不同品牌的数码相机进行分类比较。
* 讨论分享自己的比较结果。
* 教师对学生的讨论进行点评和总结，强调比较方法和选购要点。	

## 教学随笔：
性能指标决定着数码相机的品质与价值。认识这些指标，并判别它们的重要程度，有助于学生了解数码相机，掌握比较方法。首先让学生了解数码相机的性能指标，接着挑选理解能力较好的同学向其他同学讲述这些指标的作用，以此让学生理解其作用和价值。个别同学资料收集筛选能力较差，可在教师提供的根据自身需求选取资料，从而在有限时间里获得足够的上机锻炼机会，帮助自己在筛选过程中快速完成电子表格的简单分析。
