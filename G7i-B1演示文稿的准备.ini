# 课题：演示文稿的准备

## 教学目标
1.	了解演示文稿的特点；
2.	掌握演示文稿的基本结构；
3.	掌握常用版式设置与播放演示文稿的操作。
4.	了解记录资源出处的意义与方法。
5.	通过“红色之旅”相关资料的收集，进一步发展信息搜索策略

## 重点
准备行动

## 难点
不同的幻灯片版式使用于不同的内容安排

## 教学准备
演示文稿技术准备情况调查表，了解学情

## 教学过程

### 导入
* 播放"红色之旅"宣传视频（含井冈山、延安等革命圣地画面）
* 提问引导：
  - 视频中出现哪些革命圣地？
  - 这些红色景点承载着怎样的历史记忆？
>设计意图：通过直观的视频和文字资料展示，激发学生对“红色之旅”的兴趣，为后续资料收集做铺垫。

### 任务：信息检索实践
* 提供检索任务单：
  - 井冈山会师的历史意义
  - 延安精神的核心内涵
  - 当地红色景点介绍
* 强调信息溯源要求（截图保存网页来源）
* 展示往届优秀作品范例
>设计意图：培养学生信息搜索能力，同时让学生意识到记录资源出处的重要性。

### 软件初探
* 启动WPS演示
* 对比展示不同版式案例（检查页面文章对比完）
* 互动练习：这些版式适合呈现什么类型内容？
>设计意图：让学生对演示文稿制作软件有初步的认识和了解，明确不同版式的特点和适用场景，为后续的制作操作打下基础。

### 实践操作
* 新建5页幻灯片
* 学习复制粘贴不同版式

### 课堂小结
* 通过今天的学习展现你的收获和感想

## 教学随笔
本课是起始与衔接课。因部分学生小学接触过演示文稿操作，故先备“技术准备调查”了解学情。分组采用异质方式，保证每组有技术好的学生。2 节课中，材料准备与整理是难点，学生虽有些经验但欠巩固，教师提醒选恰当关键词，如“革命老区”“红色旅游”。处理资料对学生难，因认知有限，教师引导筛选整理，保证资料下堂课能用。此次学习也显示要丰富学生历史知识，如井冈山情况，以提升综合素养。
